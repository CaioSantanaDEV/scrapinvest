spring.application.name=scrapinvest-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scrapinvest}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

scrapinvest.scraper.cache-ttl-hours=${SCRAPER_CACHE_TTL_HOURS:12}
scrapinvest.scraper.timeout-ms=${SCRAPER_TIMEOUT_MS:10000}
scrapinvest.scraper.use-playwright-fallback=${SCRAPER_PLAYWRIGHT_FALLBACK:false}
scrapinvest.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36

scrapinvest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
