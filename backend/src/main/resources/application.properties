spring.application.name=scrapinvest-backend
server.port=${SERVER_PORT:8080}
spring.config.import=optional:classpath:application-local.properties

# =============================================================================
# Banco de Dados PostgreSQL (Fail-fast: variáveis obrigatórias em produção)
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA & Hibernate (Validação estrita de entidades vs schema)
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# Flyway Migrations (Hardening para Produção)
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# =============================================================================
# Motor de Web Scraping
# =============================================================================
scrapinvest.scraper.cache-ttl-hours=${SCRAPER_CACHE_TTL_HOURS:12}
scrapinvest.scraper.timeout-ms=${SCRAPER_TIMEOUT_MS:10000}
scrapinvest.scraper.use-playwright-fallback=${SCRAPER_PLAYWRIGHT_FALLBACK:false}
scrapinvest.scraper.user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36

# =============================================================================
# CORS & Segurança
# =============================================================================
scrapinvest.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =============================================================================
# Autenticação Stateless JWT (Fail-fast: segredo obrigatório em produção)
# =============================================================================
scrapinvest.jwt.secret=${JWT_SECRET}
scrapinvest.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
